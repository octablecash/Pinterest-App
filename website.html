<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio – Projekt</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #1a1a1a;
    --accent: #e0245e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121212; --fg: #f2f2f2; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 96px;
    margin: 0 auto 24px;
  }
  .grid div { aspect-ratio: 1; border-radius: 6px; background: #e5e5e5; }
  .grid div:nth-child(5) { background: var(--accent); }
  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  p { line-height: 1.5; color: #777; font-size: 0.95rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid">
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
    </div>
    <h1>Studio Projekt</h1>
    <p>Persönliches Recherche- und Moodboard-Tool auf Basis eines modularen Rastersystems. Wird zur privaten Organisation von Design-Inspiration verwendet.</p>
  </div>
</body>
</html>
