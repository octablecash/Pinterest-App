<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pinautomatisierung Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="0.55" stop-color="#E0247A"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2a0845" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Moodboard-Raster (Masonry) -->
  <g filter="url(#shadow)">
    <rect x="104" y="96"  width="140" height="180" rx="28" fill="#fff" fill-opacity="0.9"/>
    <rect x="104" y="292" width="140" height="124" rx="28" fill="#fff" fill-opacity="0.45"/>
    <rect x="268" y="96"  width="140" height="116" rx="28" fill="#fff" fill-opacity="0.6"/>
    <rect x="268" y="228" width="140" height="188" rx="28" fill="#fff"/>
  </g>
  <!-- Blitz = Automatisierung -->
  <path d="M352 250 L298 334 L334 334 L318 396 L376 306 L340 306 L358 250 Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="6" stroke-linejoin="round"/>
</svg>
